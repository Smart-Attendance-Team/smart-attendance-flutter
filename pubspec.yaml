name: smart_attendance
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  mobile_scanner: ^7.0.0
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  qr_flutter: ^4.1.0
  intl: ^0.20.2
  path_provider: ^2.1.4
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/11.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/11.png"
  remove_alpha_ios: true